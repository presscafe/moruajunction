<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263a"/>
      <stop offset="1" stop-color="#080f18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f5d79a"/>
      <stop offset="0.55" stop-color="#e3ac50"/>
      <stop offset="1" stop-color="#b9762a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- roofline: the junction -->
  <path d="M96 214 L256 104 L416 214" fill="none" stroke="url(#gold)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M128 214 V388 M384 214 V388" fill="none" stroke="url(#gold)" stroke-width="18"
        stroke-linecap="round" opacity="0.55"/>
  <path d="M128 300 H384" fill="none" stroke="url(#gold)" stroke-width="12"
        stroke-linecap="round" opacity="0.35"/>

  <!-- the monogram -->
  <text x="256" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="168"
        font-weight="700" text-anchor="middle" fill="url(#gold)" letter-spacing="2">MJ</text>

  <!-- light spill -->
  <circle cx="256" cy="214" r="150" fill="url(#gold)" opacity="0.07"/>
</svg>
