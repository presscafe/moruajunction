<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morua Junction — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 500px at 70% -10%, rgba(227, 172, 80, 0.16), transparent 60%), #0b1522;
        color: #e8eef6;
        font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 1.6rem;
      }
      .card {
        max-width: 460px;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 2.2rem;
      }
      .mark {
        width: 62px; height: 62px; margin: 0 auto 1.2rem;
        display: grid; place-items: center; border-radius: 16px;
        background: linear-gradient(150deg, #e3ac50, #b9762a);
        color: #241704; font-weight: 800; font-size: 1.5rem;
        font-family: Georgia, serif;
      }
      h1 { font-family: Georgia, serif; font-size: 1.7rem; margin: 0 0 0.6rem; }
      p { color: #9fb0c6; font-size: 0.95rem; line-height: 1.6; }
      a {
        display: inline-block; margin-top: 1.2rem; padding: 0.65rem 1.3rem;
        border-radius: 999px; background: linear-gradient(140deg, #e3ac50, #c8862f);
        color: #241704; font-weight: 700; text-decoration: none; font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">MJ</div>
      <h1>You are offline</h1>
      <p>
        The mall is still here — the shops you walked into are cached on this device. Reconnect to
        refresh prices, place an order or check a delivery.
      </p>
      <a href="/">Back to the Concourse</a>
    </div>
    <script>
      window.addEventListener('online', function () {
        location.reload()
      })
    </script>
  </body>
</html>
