[package]
name = "morua-junction"
version = "0.1.0"
edition = "2021"
description = "Morua Junction — Gaborone's virtual mall. Rust API service."
license = "Apache-2.0"

[[bin]]
name = "morua"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
