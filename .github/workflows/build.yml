name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::cargo test failures"
            grep -E "^(error|warning|failures:|test .* FAILED)" cargo-test.log | head -40 | while IFS= read -r line; do
              echo "::error title=cargo test::${line//::/:}"
            done
            echo "::endgroup::"
          fi
          exit $status

      - name: Build release binary
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee cargo-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::cargo build errors"
            grep -E "^(error|warning)" cargo-build.log | head -40 | while IFS= read -r line; do
              echo "::error title=cargo build::${line//::/:}"
            done
            echo "::endgroup::"
          fi
          exit $status

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: morua-linux
          path: rust/target/release/morua
          if-no-files-found: error
