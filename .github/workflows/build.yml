name: build

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Test
        run: |
          set +e
          cargo test 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Build release binary
        run: |
          set +e
          cargo build --release 2>&1 | tee cargo-build.log
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the API contract
        run: |
          set +e
          rm -f /tmp/morua-contract.db*
          MORUA_DB=/tmp/morua-contract.db ./target/release/morua &
          server=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 1
          done
          node ../scripts/contract-check.mjs http://127.0.0.1:8787 2>&1 | tee contract-check.log
          status=${PIPESTATUS[0]}
          kill $server 2>/dev/null || true
          echo "exit=$status" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Publish the binary and diagnostics
        if: always()
        run: |
          mkdir -p ../diagnostics
          cp cargo-test.log ../diagnostics/cargo-test.txt 2>/dev/null || true
          cp cargo-build.log ../diagnostics/cargo-build.txt 2>/dev/null || true
          cp target/release/morua ../diagnostics/morua-linux 2>/dev/null || true
          cp Cargo.lock ../diagnostics/Cargo.lock 2>/dev/null || true
          cp contract-check.log ../diagnostics/contract-check.txt 2>/dev/null || true
          cd ..
          git config user.name "morua-ci"
          git config user.email "morua-ci@users.noreply.github.com"
          git checkout -B ci/diagnostics
          git add -f diagnostics || true
          git commit -m "build output" || true
          git push origin ci/diagnostics --force || true

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: morua-linux
          path: rust/target/release/morua
          if-no-files-found: error

  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The dataset toolkit uses node:sqlite, which is only available
          # from Node 22.13 without a flag.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:web

      - name: Check the cache policy
        run: npm run check:cache

      - name: Check the dataset matches the toolkit
        run: |
          set +e
          npm run check:dataset 2>&1 | tee dataset-check.log
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # The check puts the dataset back as it found it, so the tree must
          # still be clean: the committed catalogue is the catalogue.
          git diff --exit-code -- rust/seed/morua.json

      - name: Check the PWA assets are in the bundle
        run: |
          set +e
          missing=0
          for asset in index.html manifest.webmanifest sw.js offline.html icons/icon-192.png icons/icon-512.png; do
            if [ ! -f "dist/public/$asset" ]; then
              echo "missing from the bundle: $asset"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi
          echo "every PWA asset is in the bundle" >> "$GITHUB_STEP_SUMMARY"
